name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4
        
      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları Yükle
        shell: bash
        run: |
          rm -f package-lock.json
          npm install

      - name: Uygulamayı Derle ve GitHub'a Yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: npm run electron:build -- -p always

      # electron-builder sürümü taslak (draft) olarak yükler. Otomatik güncellemenin görmesi için
      # taslak burada yayınlanır; yayınlanırken v<sürüm> etiketi de oluşturulur.
      # Sürüm zaten yayındaysa (aynı numarayla yeniden gönderim) bir şey değişmez.
      - name: Sürümü Yayınla (otomatik güncelleme için)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -q true; then
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest --target "$GITHUB_SHA"
            echo "$VERSION yayınlandı."
          else
            echo "$VERSION zaten yayında ya da taslak bulunamadı; değişiklik yapılmadı."
          fi
